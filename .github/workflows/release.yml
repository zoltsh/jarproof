name: release

# Tag a release and this workflow assembles it. It never publishes: the draft release is the
# hand-off point, and Maven Central publication stays a manual step in alpha.
# `workflow_dispatch` runs the same build and gates without creating a release, so the pipeline can
# be exercised from a branch before a tag exists.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: jarproof-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One archive per supported platform, each built and gated on the platform it ships for --
  # a native binary is only proven by the machine that produced it. Windows is deliberately
  # absent: the uber JAR is the Windows story until setup-zolt and Zolt support it.
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            zoltSha256: ca733b6b5579d3393bb729685cf8401e52397e12181ac65fadc125a346cedb40
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            zoltSha256: 829dac7b6a79f63a1b66a1810dbc5741b94e72c05f721329c60ef61beaa7dd4b
          - runner: macos-13
            platform: macos-x64
            zoltSha256: 62b71be7319c920157ebb1dfc7108af1c88b59dbfe20c776c46c6b4177d52a57
          - runner: macos-15
            platform: macos-arm64
            zoltSha256: 634efe024c58ce9e4400bf47a10d2e93298c423e4fcf9b80ff09086e71bb3a8f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag names every artifact; the declared version names every report. Refuse to build a
      # release where the two disagree, because the tests pin the declared version and would stay
      # green while shipping the wrong one.
      - name: Gate the tag against the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          declared=$(grep -m1 '^version' apps/jarproof/zolt.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$declared" || {
            echo "tag $GITHUB_REF_NAME does not match the declared project version $declared"
            exit 1
          }

      - name: Set up Zolt
        uses: zoltsh/setup-zolt@daaac64a8f2b58dd8ee0ab53b16085a64e20a0ad # v1.0.2
        with:
          channel: zap
          version: 0.1.0-zap.20260810.e45c94a87776
          sha256: ${{ matrix.zoltSha256 }}

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Check repository
        run: scripts/check

      - name: Compare the native binary against the uber JAR
        run: scripts/native-parity

      - name: Record the glibc floor
        if: runner.os == 'Linux'
        run: |
          set -eu
          floor=$(objdump -T apps/jarproof/target/native/jarproof \
            | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -Vu | tail -1)
          echo "This binary requires glibc $floor or newer." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the platform archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          name=jarproof-$version-$PLATFORM
          mkdir -p "target/release/$name"
          cp apps/jarproof/target/native/jarproof "target/release/$name/jarproof"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "target/release/$name/"
          cp release/archive-README.md "target/release/$name/README.md"
          tar czf "target/release/$name.tar.gz" -C target/release "$name"
          ls -l "target/release/$name.tar.gz"

      - name: Upload the platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jarproof-${{ matrix.platform }}
          path: target/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The release-blocking gates that only make sense once every platform archive exists.
  release:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zolt
        uses: zoltsh/setup-zolt@daaac64a8f2b58dd8ee0ab53b16085a64e20a0ad # v1.0.2
        with:
          channel: zap
          version: 0.1.0-zap.20260810.e45c94a87776
          sha256: ca733b6b5579d3393bb729685cf8401e52397e12181ac65fadc125a346cedb40

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Download the platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jarproof-*
          path: target/release/files
          merge-multiple: true

      - name: Package the workspace
        run: |
          set -eu
          zolt package --workspace --all
          uber=
          for candidate in apps/jarproof/target/jarproof-cli-*.jar; do
            case $candidate in
            *-sources.jar | *-javadoc.jar) continue ;;
            esac
            uber=$candidate
          done
          test -f "$uber" || { echo "packaging produced no uber JAR"; exit 1; }
          printf 'UBER_JAR=%s\n' "$uber" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Dogfood contract rule 7: jarproof verifies its own packaged artifact before release. The
      # copy gives the analysis a version-stable relative path, because a baseline fingerprint
      # carries the artifact it describes.
      - name: Verify jarproof against its own uber JAR
        run: |
          set -eu
          mkdir -p target/dist
          cp "$UBER_JAR" target/dist/jarproof-cli.jar
          zolt exec --quiet -- java -jar "$UBER_JAR" check \
            --application target/dist/jarproof-cli.jar \
            --target-java 17 \
            --scope application \
            --path-root . \
            --baseline release/self-baseline.json \
            --format human

      - name: Generate the CycloneDX SBOM
        run: zolt sbom --workspace --output "target/release/files/jarproof-$VERSION-cyclonedx.json"

      - name: Generate SHA256SUMS
        working-directory: target/release/files
        run: |
          set -eu
          cp "$GITHUB_WORKSPACE/$UBER_JAR" .
          sha256sum -- *.tar.gz *.jar *.json > SHA256SUMS
          cat SHA256SUMS

      # Publishing itself is manual in alpha. With no [publish] targets declared yet this step
      # proves lock freshness only -- it reports an empty publish family and cannot catch routing
      # gaps until members declare targets.
      - name: Check publishability
        run: zolt publish --workspace --members modules/jarproof-api,modules/jarproof-engine,apps/jarproof --dry-run

      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            target/release/files/*.tar.gz \
            target/release/files/*.jar \
            target/release/files/*.json \
            target/release/files/SHA256SUMS
