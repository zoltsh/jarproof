name: release

# A tag assembles the GitHub release and, after approval through the maven-central environment,
# publishes the three public modules to Maven Central. `workflow_dispatch` exercises the same
# protected signing path through a local Central bundle dry run without uploading anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: jarproof-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One archive per supported platform, each built and gated on the platform it ships for --
  # a native binary is only proven by the machine that produced it. Windows is deliberately
  # absent until setup-zolt and Zolt support it. macOS x64 is absent because GraalVM 25 no
  # longer publishes an Intel Mac Native Image toolchain; the uber JAR covers both platforms.
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            zoltSha256: 11c55e4117d55d1776c5eddca801b8e5f65cc9b16f2c5a8313b9f473547fdd57
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            zoltSha256: bf8a49aab74d2cc05f01f044b15d7b6b8f8263dc8aefe9168fbd827c3a6253c4
          - runner: macos-15
            platform: macos-arm64
            zoltSha256: 7bca990eea0f22a4f4b354c22ac3109d89818ed969781d43e0cc6442b428d661
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The tag names every artifact; the declared version names every report. Refuse to build a
      # release where the two disagree, because the tests pin the declared version and would stay
      # green while shipping the wrong one.
      - name: Gate the tag against the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          declared=$(awk '
            $0 == "[workspace.project]" { in_project = 1; next }
            in_project && /^\[/ { exit }
            in_project && /^version = "/ { gsub(/"/, "", $3); print $3; exit }
          ' zolt.toml)
          test -n "$declared"
          test "${GITHUB_REF_NAME#v}" = "$declared" || {
            echo "tag $GITHUB_REF_NAME does not match the declared project version $declared"
            exit 1
          }

      - name: Set up Zolt
        uses: zoltsh/setup-zolt@28512f86f5c1ce10d6f90849930b0eb3b81fc98b # v1.0.3
        with:
          channel: zap
          version: 0.1.0-zap.20260823.0ea7fe1473b4
          sha256: ${{ matrix.zoltSha256 }}

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Check repository
        run: scripts/check

      - name: Compare the native binary against the uber JAR
        run: scripts/native-parity

      - name: Record the glibc floor
        if: runner.os == 'Linux'
        run: |
          set -eu
          floor=$(objdump -T apps/jarproof/target/native/jarproof \
            | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -Vu | tail -1)
          echo "This binary requires glibc $floor or newer." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the platform archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          name=jarproof-$version-$PLATFORM
          mkdir -p "target/release/$name"
          cp apps/jarproof/target/native/jarproof "target/release/$name/jarproof"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "target/release/$name/"
          cp release/archive-README.md "target/release/$name/README.md"
          tar czf "target/release/$name.tar.gz" -C target/release "$name"
          ls -l "target/release/$name.tar.gz"

      - name: Upload the platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jarproof-${{ matrix.platform }}
          path: target/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The release-blocking gates that only make sense once every platform archive exists.
  release:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zolt
        uses: zoltsh/setup-zolt@28512f86f5c1ce10d6f90849930b0eb3b81fc98b # v1.0.3
        with:
          channel: zap
          version: 0.1.0-zap.20260823.0ea7fe1473b4
          sha256: 11c55e4117d55d1776c5eddca801b8e5f65cc9b16f2c5a8313b9f473547fdd57

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Download the platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jarproof-*
          path: target/release/files
          merge-multiple: true

      - name: Package the workspace
        run: |
          set -eu
          zolt exec -- sh -c "exec zolt \"-Djava.home=\$JAVA_HOME\" package --workspace --all"
          uber=
          for candidate in apps/jarproof/target/jarproof-cli-*.jar; do
            case $candidate in
            *-sources.jar | *-javadoc.jar) continue ;;
            esac
            uber=$candidate
          done
          test -f "$uber" || { echo "packaging produced no uber JAR"; exit 1; }
          printf 'UBER_JAR=%s\n' "$uber" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Dogfood contract rule 7: jarproof verifies its own packaged artifact before release. The
      # copy gives the analysis a version-stable relative path, because a baseline fingerprint
      # carries the artifact it describes.
      - name: Verify jarproof against its own uber JAR
        run: |
          set -eu
          mkdir -p target/dist
          cp "$UBER_JAR" target/dist/jarproof-cli.jar
          zolt exec --quiet -- java -jar "$UBER_JAR" check \
            --application target/dist/jarproof-cli.jar \
            --target-java 17 \
            --scope application \
            --path-root . \
            --baseline release/self-baseline.json \
            --format human

      - name: Generate the CycloneDX SBOM
        run: zolt sbom --workspace --output "target/release/files/jarproof-$VERSION-cyclonedx.json"

      - name: Generate SHA256SUMS
        working-directory: target/release/files
        run: |
          set -eu
          cp "$GITHUB_WORKSPACE/$UBER_JAR" .
          sha256sum -- *.tar.gz *.jar *.json > SHA256SUMS
          cat SHA256SUMS

      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            target/release/files/*.tar.gz \
            target/release/files/*.jar \
            target/release/files/*.json \
            target/release/files/SHA256SUMS

  publish-central:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    permissions:
      contents: read
    env:
      GNUPGHOME: ${{ github.workspace }}/target/gnupg

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zolt
        uses: zoltsh/setup-zolt@28512f86f5c1ce10d6f90849930b0eb3b81fc98b # v1.0.3
        with:
          channel: zap
          version: 0.1.0-zap.20260823.0ea7fe1473b4
          sha256: 11c55e4117d55d1776c5eddca801b8e5f65cc9b16f2c5a8313b9f473547fdd57

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Pin the build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Package the Central family
        run: zolt exec -- sh -c "exec zolt \"-Djava.home=\$JAVA_HOME\" package --workspace --members modules/jarproof-api,modules/jarproof-engine,apps/jarproof"

      - name: Import the Zolt signing key
        env:
          ZOLT_GPG_PRIVATE_KEY_B64: ${{ secrets.ZOLT_GPG_PRIVATE_KEY_B64 }}
        run: |
          set -eu
          expected=83D886E387461DDA405630E61CC0F4A47A5EC1B7
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$ZOLT_GPG_PRIVATE_KEY_B64" | base64 --decode | gpg --batch --import
          actual=$(gpg --batch --with-colons --list-secret-keys "$expected" \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual" = "$expected"

      - name: Assemble the signed Central bundle
        run: zolt publish --workspace --members modules/jarproof-api,modules/jarproof-engine,apps/jarproof --dry-run --central

      - name: Verify the signed Central bundle
        run: |
          set -euo pipefail
          test "$(find target/publish/central-staging -type f -name '*.asc' | wc -l)" -eq 12
          test "$(find target/publish/central-staging -type f -name '*.sha256' | wc -l)" -eq 24
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}" >/dev/null 2>&1
          done < <(find target/publish/central-staging -type f -name '*.asc' -print0)
          while IFS= read -r -d '' checksum; do
            expected=$(tr -d '\r\n' < "$checksum")
            actual=$(sha256sum "${checksum%.sha256}" | awk '{ print $1 }')
            test "$actual" = "$expected"
          done < <(find target/publish/central-staging -type f -name '*.sha256' -print0)
          test "$(unzip -Z1 target/publish/central-bundle.zip | wc -l)" -eq 96

      - name: Upload the signed Central bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jarproof-central-bundle
          path: target/publish/central-bundle.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ZOLT_CENTRAL_TOKEN: ${{ secrets.ZOLT_CENTRAL_TOKEN }}
        run: zolt publish --workspace --members modules/jarproof-api,modules/jarproof-engine,apps/jarproof --central --wait --wait-timeout 900
