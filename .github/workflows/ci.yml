name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarproof-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Zolt
        uses: zoltsh/setup-zolt@daaac64a8f2b58dd8ee0ab53b16085a64e20a0ad # v1.0.2
        with:
          channel: zap
          version: 0.1.0-zap.20260813.486974e1a11b
          sha256: 905f1046e60b63f674e9ca7e9912f3c47136a313dff3b1df58fe4461fe30f9d3

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Check repository
        run: scripts/check

      - name: Check clean generated state
        run: git diff --exit-code

  # Parallel to `check`, never chained into it: native-image is the slowest and most
  # memory-hungry step in the build, and the fast feedback path should not wait behind it.
  native-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zolt
        uses: zoltsh/setup-zolt@daaac64a8f2b58dd8ee0ab53b16085a64e20a0ad # v1.0.2
        with:
          channel: zap
          version: 0.1.0-zap.20260813.486974e1a11b
          sha256: 905f1046e60b63f674e9ca7e9912f3c47136a313dff3b1df58fe4461fe30f9d3

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Compare the native binary against the uber JAR
        run: scripts/native-parity
