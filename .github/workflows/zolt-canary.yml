name: zolt-canary

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Deliberately unpinned: following the moving channel is this workflow's entire purpose,
      # and it holds contents:read only. Every other workflow pins version + sha256.
      - name: Set up Zolt from the moving zap channel
        uses: zoltsh/setup-zolt@daaac64a8f2b58dd8ee0ab53b16085a64e20a0ad # v1.0.2
        with:
          channel: zap
          version: latest

      - name: Sync managed Java
        run: zolt toolchain sync

      - name: Check repository against the newest Zolt
        run: scripts/check
