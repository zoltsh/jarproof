[project]
name = "jarproof-cli"
java = 17
main = "sh.zolt.jarproof.cli.Main"
description = "Command-line verifier that finds Java artifact incompatibilities before production."
url = "https://github.com/zoltsh/jarproof"
issues = "https://github.com/zoltsh/jarproof/issues"

[project.scm]
url = "https://github.com/zoltsh/jarproof"
connection = "scm:git:https://github.com/zoltsh/jarproof.git"

[project.developers.zolt-maintainers]
name = "Zolt Maintainers"
email = "zolt@zolt.sh"
organization = "Zolt"
url = "https://zolt.sh"

[dependencies]
"sh.zolt:jarproof-api" = { workspace = true }
"sh.zolt:jarproof-engine" = { workspace = true }
"info.picocli:picocli" = "4.7.7"

# Picocli builds its command model from annotations at runtime, and native-image keeps no
# annotation or reflective member it was not told about: without this processor the native
# binary fails every invocation while the JVM build stays green. The processor emits the
# reflection metadata for exactly the annotated commands, so the config cannot drift from them.
[dependencies.processor]
"info.picocli:picocli-codegen" = "4.7.7"

[dependencies.test]
"org.junit.jupiter:junit-jupiter" = { managed = true }
"org.junit.platform:junit-platform-console" = { managed = true }
"com.google.guava:guava" = "33.6.0-jre"
"com.fasterxml.jackson.core:jackson-databind" = "2.22.2"
"io.netty:netty-buffer" = "4.2.17.Final"

[dependencies.policy.licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "EPL-2.0"]
unknown = "fail"

[package]
mode = "uber-jar"
sources = true
javadoc = true

[publish.signing]
method = "gpg"
keyId = "83D886E387461DDA405630E61CC0F4A47A5EC1B7"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
mode = "automatic"
name = "Jarproof release"

# picocli-codegen unconditionally emits an EMPTY proxy-config.json, and GraalVM 25 deprecates
# that resource format with a warning the native gate rightly refuses. Excluding the one empty
# file silences nothing real; the generated reflect-config stays load-bearing and pinned by test.
[native]
name = "jarproof"
args = ["--no-fallback", "--exclude-config", ".*", "META-INF/native-image/picocli-generated/proxy-config\\.json"]
