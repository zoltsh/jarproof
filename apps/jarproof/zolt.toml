[project]
name = "jarproof-cli"
version = "0.1.0-alpha.1-SNAPSHOT"
group = "sh.zolt"
java = "21"
main = "sh.zolt.jarproof.cli.Main"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"sh.zolt:jarproof-api" = { workspace = "modules/jarproof-api" }
"sh.zolt:jarproof-engine" = { workspace = "modules/jarproof-engine" }
"info.picocli:picocli" = "4.7.6"

[test.dependencies]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"
"com.google.guava:guava" = "33.4.8-jre"
"com.fasterxml.jackson.core:jackson-databind" = "2.18.3"
"io.netty:netty-buffer" = "4.1.115.Final"

[dependencyPolicy.licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "EPL-2.0"]
unknown = "fail"

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[package]
mode = "uber"

[native]
imageName = "jarproof"
output = "target/native"
args = ["--no-fallback"]
