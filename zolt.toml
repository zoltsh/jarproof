[workspace]
name = "jarproof"

[workspace.members]
default = ["apps/jarproof"]
include = [
    "modules/jarproof-api",
    "modules/jarproof-engine",
    "apps/jarproof",
    "guardrails/jarproof-architecture-tests",
    "fixtures/bad-service-provider",
    "fixtures/class-to-interface-api-v1",
    "fixtures/class-to-interface-api-v2",
    "fixtures/class-to-interface-consumer",
    "fixtures/duplicate-class-a",
    "fixtures/duplicate-class-b",
    "fixtures/inaccessible-api-v1",
    "fixtures/inaccessible-api-v2",
    "fixtures/inaccessible-consumer",
    "fixtures/lambda-target-api-v1",
    "fixtures/lambda-target-api-v2",
    "fixtures/lambda-target-consumer",
    "fixtures/method-handle-poly",
    "fixtures/missing-class-api-v1",
    "fixtures/missing-class-api-v2",
    "fixtures/missing-class-consumer",
    "fixtures/missing-field-api-v1",
    "fixtures/missing-field-api-v2",
    "fixtures/missing-field-consumer",
    "fixtures/missing-method-api-v1",
    "fixtures/missing-method-api-v2",
    "fixtures/missing-method-consumer",
    "fixtures/nestmates",
    "fixtures/newer-bytecode",
    "fixtures/service-api",
    "fixtures/split-package-a",
    "fixtures/split-package-b",
    "fixtures/static-instance-flip-api-v1",
    "fixtures/static-instance-flip-api-v2",
    "fixtures/static-instance-flip-consumer",
]

[workspace.project]
group = "sh.zolt"
version = "0.0.1-alpha.1"
license = "Apache-2.0"

[platforms]
"org.junit:junit-bom" = "5.14.4"

[toolchain.zolt]
version = "0.1.0-zap.20260823.0ea7fe1473b4"

[toolchain.java]
version = 25
distribution = "graalvm-community"
features = ["native-image"]
policy = "require-managed"

[coverage]
line = 90
branch = 80

[tasks.repository-check]
description = "Run the complete Jarproof repository gate"
run = ["scripts/check"]
