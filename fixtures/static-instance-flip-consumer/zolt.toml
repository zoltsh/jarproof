[project]
name = "jarproof-fixture-static-instance-flip-consumer"
version = "0.0.1-SNAPSHOT"
group = "sh.zolt"
java = "11"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"sh.zolt:jarproof-fixture-static-instance-flip-api-v1" = { workspace = "fixtures/static-instance-flip-api-v1" }


[dependencyPolicy.licenses]
