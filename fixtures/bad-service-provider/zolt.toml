[project]
name = "jarproof-fixture-bad-service-provider"
version = "0.0.1-SNAPSHOT"
group = "sh.zolt"
java = "17"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"sh.zolt:jarproof-fixture-service-api" = { workspace = "fixtures/service-api" }

[test.dependencies]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[dependencyPolicy.licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "EPL-2.0"]
unknown = "fail"

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[resources]
main = ["src/main/resources"]
